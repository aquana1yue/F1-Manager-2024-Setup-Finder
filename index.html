<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Finder — F1 Manager 2024</title>
<style>
:root{
  --bg:#0c151d; --panel:#122029; --sunk:#0a131a;
  --line:#223a48; --line-soft:#1a2c37;
  --text:#dce8ef; --dim:#7d97a7; --faint:#4d6675;
  --band:#4fb8dd; --cur:#f2f7fa; --rec:#e8b93f; --mu:#6fdcb0;
  --optimal:#a97cf5; --great:#3fc97a; --good:#e8b93f; --bad:#e2604f;
  --sans:"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 60px}

header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:13px;border-bottom:1px solid var(--line)}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px}
header .sub{color:var(--faint);font-size:13px;font-family:var(--mono)}
header .save{margin-left:auto;font-size:12px;color:var(--faint);font-family:var(--mono)}
header .save.on{color:var(--mu)}
header .save.off{color:var(--bad)}

/* ---- 賽程 ---- */
.cal{display:flex;gap:3px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:thin}
.cal::-webkit-scrollbar{height:5px}
.cal::-webkit-scrollbar-thumb{background:var(--line)}
.rnd{flex:none;width:46px;padding:5px 0 6px;border:1px solid var(--line-soft);background:var(--sunk);
  display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
.rnd:hover{border-color:var(--band)}
.rnd .r{font-family:var(--mono);font-size:9.5px;color:var(--faint);line-height:1}
.rnd .c{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.4px}
.rnd .dot{position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--mu);opacity:.75}
.rnd[aria-current=true]{border-color:var(--band);background:#10222c}
.rnd[aria-current=true] .c{color:var(--text)}
.rnd[aria-current=true] .r{color:var(--band)}

.trackbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 16px;border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.tname{font-size:15px}
.tname .rn{font-family:var(--mono);font-size:12px;color:var(--band);margin-right:8px}
.tname .gp{color:var(--faint);font-size:13px;margin-left:8px}
.nav{display:flex;gap:5px}
.pstat{font-size:12.5px;color:var(--dim);flex-basis:100%}
.pstat b{color:var(--mu);font-weight:600;font-family:var(--mono)}
.toggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);cursor:pointer;margin-left:auto}
.toggle input{accent-color:var(--mu);width:15px;height:15px}

/* ---- 賽程編輯 ---- */
.editor{border:1px solid var(--line);background:var(--panel);margin-bottom:18px}
.editor .body{padding:8px 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px}
.erow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.erow input[type=number]{width:44px;background:var(--sunk);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-size:12px;padding:3px 4px;text-align:center}
.erow .cd{font-family:var(--mono);font-size:12px;color:var(--band);width:34px}
.erow .nm{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .mv{border:none;color:var(--faint);padding:2px 4px;font-size:11px}
.erow .mv:hover{color:var(--text);border:none}

/* ---- 車輛頁籤 ---- */
.tabs{display:flex;margin-bottom:16px;border-bottom:1px solid var(--line-soft)}
.tab{border:none;border-bottom:2px solid transparent;padding:8px 18px;color:var(--dim);font-size:14px;background:none}
.tab:hover{border-color:transparent;color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--band)}
.tab .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:6px}

.cols{display:grid;grid-template-columns:308px 1fr;gap:26px;align-items:start}
@media(max-width:840px){.cols{grid-template-columns:1fr;gap:20px}}

.panel{background:var(--panel);border:1px solid var(--line-soft)}
.panel + .panel{margin-top:18px}
.panel > h2{font-size:12px;font-weight:600;color:var(--dim);margin:0;padding:11px 14px;border-bottom:1px solid var(--line-soft);letter-spacing:.3px}
.panel .body{padding:14px}

/* ---- 滑桿 ---- */
.sl{padding:11px 0;border-left:2px solid transparent;padding-left:8px;margin-left:-10px;transition:border-color .2s}
.sl + .sl{border-top:1px solid var(--line-soft)}
.sl.changed{border-left-color:var(--rec)}
.sl-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.badge{width:19px;height:19px;flex:none;display:grid;place-items:center;border:1px solid var(--line);color:var(--dim);font-size:11px;font-family:var(--mono)}
.sl-name{flex:1;font-size:13.5px}
.sl-val{font-size:14px}
.sl.changed .sl-val{color:var(--rec)}
.delta{font-family:var(--mono);font-size:11px;color:var(--rec);border:1px solid var(--rec);padding:0 4px;opacity:.9}
.sl input[type=range]{width:100%;margin:0;accent-color:var(--band);height:18px;background:transparent;cursor:pointer}
.sl.changed input[type=range]{accent-color:var(--rec)}
.sl-foot{display:flex;justify-content:space-between;color:var(--faint);font-size:11.5px;margin-top:2px}

/* ---- 收斂 ---- */
.status{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.status .n{font-family:var(--mono);font-size:24px;letter-spacing:-.5px}
.status .n.solved{color:var(--great)}
.status .n.dead{color:var(--bad)}
.status .n.busy{color:var(--faint)}
.status .lbl{color:var(--dim);font-size:12.5px}

.dim{display:grid;grid-template-columns:84px 1fr 138px;align-items:center;gap:12px;padding:9px 0}
.dim + .dim{border-top:1px solid var(--line-soft)}
.dim-name{font-size:13px;color:var(--dim)}
.track{position:relative;height:28px;background:var(--sunk);border:1px solid var(--line-soft)}
.seg{position:absolute;top:0;bottom:0;background:var(--band);border-left:1px solid var(--band);border-right:1px solid var(--band)}
.whisk{position:absolute;top:50%;height:1px;background:var(--mu);opacity:.45}
.mark{position:absolute;top:-1px;bottom:-1px;width:2px;margin-left:-1px}
.mark.cur{background:var(--cur)}
.mark.mu{background:var(--mu);opacity:.85}
.dim-num{text-align:right;font-family:var(--mono);font-size:11.5px;line-height:1.4}
.dim-num .v{display:block;font-size:14px}
.dim-num .r{display:block;color:var(--faint)}
.dim-num .split{display:block;color:var(--band)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 14px 13px;font-size:11.5px;color:var(--faint)}
.legend i{display:inline-block;width:9px;height:2px;vertical-align:middle;margin-right:5px}

/* ---- 回饋 ---- */
.fb{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:12px;padding:7px 0}
.fb + .fb{border-top:1px solid var(--line-soft)}
.fb-name{font-size:13px;color:var(--dim)}
.satin{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.satin input{width:64px;background:var(--sunk);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:13px;padding:5px 7px;text-align:right}
.satin input:focus{outline:none;border-color:var(--band)}
.satin > span{color:var(--faint);font-size:12px}
.sat{font-family:var(--mono);font-size:11px;color:var(--mu);border:1px solid var(--line);padding:1px 5px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
button{font-family:inherit;font-size:13px;color:var(--text);background:transparent;border:1px solid var(--line);padding:6px 8px;cursor:pointer}
button:hover{border-color:var(--band)}
button:focus-visible{outline:2px solid var(--band);outline-offset:1px}
button:disabled{opacity:.4;cursor:not-allowed}
.opt{font-size:12px;padding:5px 4px;color:var(--dim)}
.opt[aria-pressed=true]{color:#0c151d;font-weight:600;border-color:transparent}
.opt[data-r="0"][aria-pressed=true]{background:var(--optimal)}
.opt[data-r="1"][aria-pressed=true]{background:var(--great)}
.opt[data-r="2"][aria-pressed=true]{background:var(--good)}
.opt[data-r="3"][aria-pressed=true]{background:var(--bad)}
.opt[data-r="-1"][aria-pressed=true]{background:var(--faint);color:var(--text)}

.actions{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft);flex-wrap:wrap;align-items:center}
.primary{background:var(--band);border-color:var(--band);color:#08131a;font-weight:600;padding:8px 16px}
.primary:hover{filter:brightness(1.1)}
.primary:disabled{filter:none}
.why{padding:10px 14px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--faint);line-height:1.6}
.why b{color:var(--mu);font-weight:600}
.why em{color:var(--rec);font-style:normal}
.warn{color:var(--bad);font-size:13px;padding:0 14px 14px;line-height:1.55}
.hint{color:var(--faint);font-size:12px;padding:0 14px 14px;line-height:1.6}

/* ---- 歷史 ---- */
.hrow{display:flex;align-items:center;gap:12px;padding:9px 14px;font-size:13px;flex-wrap:wrap}
.hrow + .hrow{border-top:1px solid var(--line-soft)}
.hrow .no{color:var(--faint);font-family:var(--mono);font-size:12px;width:18px;flex:none}
.hrow .setup{font-family:var(--mono);font-size:12.5px;color:var(--dim);flex:none}
.tags{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.tag{font-size:11px;padding:2px 6px;border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}
.tag[data-r="0"]{border-color:var(--optimal);color:var(--optimal)}
.tag[data-r="1"]{border-color:var(--great);color:var(--great)}
.tag[data-r="2"]{border-color:var(--good);color:var(--good)}
.tag[data-r="3"]{border-color:var(--bad);color:var(--bad)}
.del{border:none;color:var(--faint);font-size:12px;padding:4px 6px}
.del:hover{color:var(--bad);border:none}
.empty{color:var(--faint);font-size:13px;padding:14px}
.badge2{font-family:var(--mono);font-size:11px;color:#0c151d;background:var(--rec);padding:1px 6px;margin-left:6px}
.sl.locked{opacity:.42}
.sl.locked .sl-name::after{content:" 鎖定";color:var(--faint);font-size:11px}
.sprint{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--dim);cursor:pointer;margin-left:auto}
.sprint input{accent-color:var(--rec);width:15px;height:15px}
.sprint.on{color:var(--rec)}
.aopts{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.aopt{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:2px 6px;color:var(--dim)}
.aopt.best{border-color:var(--rec);color:var(--rec)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.calc label{display:block;font-size:11.5px;color:var(--faint);margin-bottom:3px}
.calc input{width:100%;background:var(--sunk);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-size:14px;padding:6px 8px}
.calc input:focus{outline:none;border-color:var(--band)}
.calc .full{grid-column:1/-1}
.cres{border-top:1px solid var(--line-soft);padding:12px 14px}
.cres .big{font-family:var(--mono);font-size:26px;letter-spacing:-.5px;line-height:1.1}
.cres .big small{font-size:13px;color:var(--dim);margin-left:5px;letter-spacing:0}
.cres .sub{font-size:12px;color:var(--faint);margin-top:6px;line-height:1.7}
.cres .sub b{color:var(--dim);font-weight:400;font-family:var(--mono)}
.cres .warn2{color:var(--rec)}
.fbfor{display:flex;align-items:center;gap:8px;padding:8px 0 10px;margin-bottom:4px;
  border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--faint);flex-wrap:wrap}
.fbfor b{font-family:var(--mono);font-size:12.5px;color:var(--text);font-weight:400}
.diag{padding:12px 14px;border-top:1px solid var(--line-soft);font-size:13px;line-height:1.65}
.diag .hd{color:var(--bad);margin-bottom:8px}
.diag .fix{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
.diag .fix .s{font-family:var(--mono);font-size:12.5px;color:var(--great)}
.diag .fix .w{color:var(--faint);font-size:12px}
.diag button{padding:4px 10px;font-size:12px;border-color:var(--great);color:var(--great)}
.diag button:hover{background:var(--great);color:#0c151d}
.lsec{font-size:11.5px;color:var(--faint);padding:10px 14px 4px;letter-spacing:.3px}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12.5px;flex-wrap:wrap}
.lrow + .lrow{border-top:1px solid var(--line-soft)}
.lrow .tm{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
.lrow .tr{font-family:var(--mono);font-size:11.5px;color:var(--band);width:38px;flex:none}
.lrow .cr{font-size:11px;color:var(--faint);flex:none}
.lrow .st{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none}
.lrow .nn{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
.lrow.solved{background:#141f22}
.lrow.solved .st{color:var(--great)}
.lrow .add{padding:3px 8px;font-size:11.5px;border-color:var(--great);color:var(--great)}
.lrow .add:hover{background:var(--great);color:#0c151d}
textarea{width:100%;height:110px;background:var(--sunk);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:11.5px;padding:9px;resize:vertical}
.samples{font-family:var(--mono);font-size:12px;color:var(--dim);padding:0 14px 12px;line-height:1.7}
.srow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;white-space:pre}
.srow .no{color:var(--faint)}
.srow .sv{color:var(--faint)}
.srow .rep{color:var(--rec);font-size:11px}
.sdel{margin-left:auto;border:none;color:var(--faint);font-size:11.5px;padding:1px 6px}
.sdel:hover{color:var(--bad);border:none}
.sdel.armed{color:#0c151d;background:var(--bad);font-weight:600}
.lbtn{margin-left:auto;display:flex;gap:6px}
.lrow .ign{padding:3px 8px;font-size:11.5px;color:var(--faint)}
.lrow .ign:hover{border-color:var(--bad);color:var(--bad)}
@media(prefers-reduced-motion:no-preference){.seg,.mark{transition:left .18s ease,width .18s ease}}

/* ---- 三欄版面：寬螢幕左 ATR、右輪胎；不夠寬時兩側退到主內容下方 ---- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "tyre" "atr"}
.shell > .wrap{grid-area:main;width:100%}
#atrSide{grid-area:atr} #tyreSide{grid-area:tyre}
.side{width:100%;max-width:1080px;margin:0 auto;padding:0 20px 40px}
.side .panel + .panel{margin-top:18px}
@media(min-width:1440px){
  .shell{grid-template-columns:minmax(290px,350px) minmax(0,1080px) minmax(320px,400px);
         grid-template-areas:"atr main tyre";justify-content:center;column-gap:4px}
  .shell > .wrap{margin:0}
  .side{max-width:none;margin:0;padding:26px 0 40px;position:sticky;top:0;align-self:start;
        max-height:100vh;overflow-y:auto;scrollbar-width:thin}
  #atrSide{padding-left:16px} #tyreSide{padding-right:16px}
}
header .season{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);margin-left:auto}
header .season input{width:66px;background:var(--sunk);border:1px solid var(--line);color:var(--text);font-size:13px;padding:3px 6px}
header .season button{padding:2px 8px;font-size:13px}
header .season + .save{margin-left:10px}

.side input:not([type=checkbox]),.side select{width:100%;background:var(--sunk);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-size:13px;padding:5px 7px}
.side input:focus,.side select:focus{outline:none;border-color:var(--band)}
.side label{display:block;font-size:11.5px;color:var(--faint)}
.side label > input,.side label > select{margin-top:3px}
.side .note{font-family:var(--sans)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.chips.two{grid-template-columns:1fr 1fr} .chips.four{grid-template-columns:repeat(4,1fr)} .chips.five{grid-template-columns:repeat(5,1fr)} .chips.six{grid-template-columns:repeat(6,1fr)}
.chip{font-size:11.5px;padding:5px 2px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed=true]{background:var(--band);border-color:var(--band);color:#08131a;font-weight:600}
.chip.c-s[aria-pressed=true]{background:#e2604f;border-color:#e2604f}
.chip.c-m[aria-pressed=true]{background:#e8b93f;border-color:#e8b93f}
.chip.c-h[aria-pressed=true]{background:#dce8ef;border-color:#dce8ef}
.chip.c-i[aria-pressed=true]{background:#3fc97a;border-color:#3fc97a}
.chip.c-w[aria-pressed=true]{background:#4fb8dd;border-color:#4fb8dd}
.atr-tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--line-soft)}
.atr-tot .quota{grid-column:1/-1;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.atr-form,.ty-form{display:flex;flex-direction:column;gap:9px}
.hrs{display:grid;grid-template-columns:38px 1fr auto auto auto;gap:4px;align-items:center}
.hrs label{font-size:12px;color:var(--dim)}
.hrs .q{font-family:var(--mono);font-size:11px;padding:4px 7px;color:var(--dim)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ferr{color:var(--bad);font-size:12px;margin:0}
.tylive{font-family:var(--mono);font-size:12.5px;color:var(--dim);min-height:18px}
.tylive b{color:var(--rec);font-weight:600}
.tagrow .tags{margin-top:5px}
.tag.user{border-color:var(--line);color:var(--rec)}
.tag button{border:none;padding:0 0 0 5px;font-size:11px;color:var(--faint)}
.side label.excl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);cursor:pointer}
.excl input{accent-color:var(--bad)}
/* ATR 圖表 */
.abl{padding:10px 14px 4px;border-top:1px solid var(--line-soft)}
.abl .t{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
.abl .t b{font-family:var(--mono);font-weight:400;color:var(--text)}
.abar{position:relative;display:flex;height:12px;background:var(--sunk);border:1px solid var(--line-soft);overflow:hidden}
.abar i{display:block;height:100%}
.abar i.d{background:var(--band)} .abar i.r{background:var(--optimal)}
.abar.over{border-color:var(--bad)}
.arow{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:11.5px;color:var(--faint);margin:4px 0}
.arow .abar{height:8px}
.arow .v{text-align:right;font-family:var(--mono);color:var(--dim)}
.alg{display:flex;gap:12px;font-size:11px;color:var(--faint);padding:2px 14px 10px}
.alg i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.erow2{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:3px 8px;padding:6px 14px;font-size:12px;border-top:1px solid var(--line-soft)}
.erow2 .p{color:var(--text)}
.erow2 .k{font-family:var(--mono);font-size:10.5px;padding:0 4px;border:1px solid var(--line)}
.erow2 .k.d{color:var(--band);border-color:var(--band)} .erow2 .k.r{color:var(--optimal);border-color:var(--optimal)}
.erow2 .h{font-family:var(--mono);color:var(--dim)}
.erow2 .nt{color:var(--faint);grid-column:1/-1;font-size:11.5px}
.erow2 .x{border:none;color:var(--faint);font-size:11.5px;padding:1px 6px}
.erow2 .x:hover{color:var(--bad);border:none}
.x.armed,.ydel.armed{color:#0c151d!important;background:var(--bad);font-weight:600}
details.yr{border-top:1px solid var(--line-soft)}

/* ================= 求解 ================= */
function ok(list,x){
  for(let i=0;i<list.length;i++){
    const c=list[i], d=Math.abs(x-c.v);
    if(d<c.lo-EPS||d>c.hi+EPS) return false;
  }
  return true;
}
function forEachCandidate(cons,cb){
  const O=DIMS[0].c,B=DIMS[1].c,C=DIMS[2].c,T=DIMS[3].c,S=DIMS[4].c;
  const v=[0,0,0,0,0];
  for(let a=0;a<21;a++){
    const oa=DIMS[0].base+a*O[0], ba=DIMS[1].base+a*B[0], ca=DIMS[2].base+a*C[0], ta=DIMS[3].base+a*T[0];
    for(let b=0;b<15;b++){
      const sv=DIMS[4].base+a*S[0]+b*S[1];
      if(!ok(cons[4],sv)) continue;                    // Straights 只吃 A、B
      const ob=oa+b*O[1], bb=ba+b*B[1], cb2=ca+b*C[1], tb=ta+b*T[1];
      for(let c=0;c<9;c++){
        const oc=ob+c*O[2], bc=bb+c*B[2], cc=cb2+c*C[2], tc=tb+c*T[2];
        for(let d=0;d<17;d++){
          const ov=oc+d*O[3]; if(!ok(cons[0],ov)) continue;   // Oversteer 不吃 E
          const tv=tc+d*T[3]; if(!ok(cons[3],tv)) continue;   // Traction 不吃 E
          const bd=bc+d*B[3], cd=cc+d*C[3];
          for(let e=0;e<21;e++){
            const bv=bd+e*B[4]; if(!ok(cons[1],bv)) continue;
            const cv=cd+e*C[4]; if(!ok(cons[2],cv)) continue;
            v[0]=ov;v[1]=bv;v[2]=cv;v[3]=tv;v[4]=sv;
            cb(a,b,c,d,e,v);
          }
        }
      }
    }
  }
}
function solve(cons,pts,noInfo){
  let n=0;
  const sum=[0,0,0,0,0], mn=[9,9,9,9,9], mx=[-9,-9,-9,-9,-9];
  const bins=new Int32Array(5*BINS);
  forEachCandidate(cons,(a,b,c,d,e,v)=>{
    n++;
    for(let i=0;i<5;i++){
      const x=v[i]; sum[i]+=x;
      if(x<mn[i])mn[i]=x; if(x>mx[i])mx[i]=x;
      let k=(x*BINS)|0; if(k>=BINS)k=BINS-1; if(k<0)k=0;
      bins[i*BINS+k]++;
    }
  });
  if(n===0) return {n:0};
  const mean=sum.map(x=>x/n);
  // 有先驗：挑「先驗落點密度」最高的候選（KDE），而不是離平均 μ 最近的。
  // 平均值在雙峰或貼邊界的賽道（例如摩納哥）會落在兩群中間、或永遠在邊界內側，
  // 導致選點一格一格往外爬。沒有先驗才退回幾何中心。
  let best=null, bs=-Infinity, mode="center";
  const keep = pts && n<=INFO_MAX && n>1 ? [] : null;
  forEachCandidate(cons,(a,b,c,d,e,v)=>{
    let s;
    if(pts) s=kde(v,pts);
    else { s=0; for(let i=0;i<5;i++){const t=v[i]-mean[i]; s-=t*t;} }
    if(s>bs){bs=s; best=[a,b,c,d,e];}
    if(keep) keep.push({s:[a,b,c,d,e], v:v.slice(), w:s+1e-6});
  });
  if(pts) mode="kde";
  if(keep&&PICK_INFO&&!noInfo){ best=infoPick(keep); mode="info"; }
  return {n,min:mn,max:mx,mean,best,bins,usedPrior:!!pts,mode};
}
// 剩下的解夠少時：在候選裡挑「期望剩餘解最少」的那組（依先驗密度加權），
// 並把「直接命中、這輪就收工」的機率算進去。只在候選解中挑，所以每一輪都有機會就是答案。
function infoPick(cs){
  const W=cs.reduce((a,c)=>a+c.w,0);
  let best=null, be=Infinity, bw=-1;
  for(const p of cs){
    const map=new Map();
    for(const q of cs){
      let sig=0;
      for(let k=0;k<5;k++) sig=sig*4+rateOf(Math.abs(p.v[k]-q.v[k]));
      map.set(sig,(map.get(sig)||0)+q.w);
    }
    let ss=0; for(const m of map.values()) ss+=m*m;
    const e=ss/W - p.w/W;
    if(e<be-1e-12 || (Math.abs(e-be)<=1e-12 && p.w>bw)){ be=e; best=p.s; bw=p.w; }
  }
  return best.slice();
}
function kde(v,pts){
  let s=0;
  for(let j=0;j<pts.length;j++){
    const p=pts[j]; let dd=0;
    for(let i=0;i<5;i++){const t=v[i]-p[i]; dd+=t*t;}
    s+=Math.exp(-dd*KDE_K);
  }
  return s;
}
function kdeModeGrid(pts){
  let best=null,bs=-Infinity;
  forEachCandidate([[],[],[],[],[]],(a,b,c,d,e,v)=>{
    const s=kde(v,pts); if(s>bs){bs=s; best=[a,b,c,d,e];}
  });
  return best;
}
function segments(bins,dim,n){
  const raw=[]; let s=-1,acc=0;
  for(let k=0;k<BINS;k++){
    const c=bins[dim*BINS+k];
    if(c>0){ if(s<0){s=k;acc=0;} acc+=c; }
    else if(s>=0){ raw.push({a:s/BINS,b:k/BINS,share:acc/n}); s=-1; }
  }
  if(s>=0) raw.push({a:s/BINS,b:1,share:acc/n});
  const out=[];
  for(const r of raw){
    const last=out[out.length-1];
    if(last && r.a-last.b < MERGE_GAP-EPS){ last.b=r.b; last.share+=r.share; }
    else out.push({...r});
  }
  return out;
}

function constraintsOf(car){

function countOnly(cons){ let n=0; forEachCandidate(cons,()=>{n++;}); return n; }
function consOfRounds(rounds){
  const cons=[[],[],[],[],[]];
  for(const h of rounds){
    const v=values(h.setup);
    h.ratings.forEach((r,i)=>{ if(r!==null) cons[i].push({v:v[i],lo:RATINGS[r].lo,hi:RATINGS[r].hi}); });
  }

}
// 最後一輪是你當下看得到、可以立刻對照遊戲畫面的那一輪，視為可信標的，
// 只在它之前的輪次裡找「滑桿與建議不一致」或「回饋點錯」這兩種人為錯誤。
function diagnose(){
  const H=C().history;
  if(H.length<2) return null;
  const last=H.length-1;
  const fallback=solve(consOfRounds([H[last]]),PRI());   // 只採信最後一輪 + 先驗
  const suspects=[];
  for(let i=0;i<last;i++){
    const n=countOnly(consOfRounds(H.filter((_,j)=>j!==i)));
    if(n>0) suspects.push({i,n,fixes:repairRound(i)});
  }
  if(!suspects.length) return {suspects:[],fixes:[],target:-1,fallback};
  suspects.sort((a,b)=>{
    const ca=a.fixes.length?a.fixes[0].cost:99, cb=b.fixes.length?b.fixes[0].cost:99;
    return ca-cb || a.i-b.i;
  });
  return {suspects, target:suspects[0].i, fixes:suspects[0].fixes, fallback};
}
const REPAIR_CAP=20000;

// 只列出會讓答案改變的情況，同一組替代解只列一次，依離先驗（或原解）遠近排序。
const ALT_MAX=5;
function alternatives(){
  const H=C().history, res=C().result;
  if(!res||res.n!==1) return [];
  const mu=MU(), pts=PRI(), ref=mu||values(res.best);
  const found=new Map();
  H.forEach((h,ri)=>h.ratings.forEach((r,dim)=>{
    if(r===null) return;
    for(const nr of [r-1,r+1]){
      if(nr<0||nr>3) continue;
      const rounds=H.map((x,j)=>j!==ri?x:{setup:x.setup,ratings:x.ratings.map((y,k)=>k===dim?nr:y)});
      const alt=solve(consOfRounds(rounds),pts,true);   // 問的是「最可能的答案」，不需要資訊增益
      if(!alt.n||sameSetup(alt.best,res.best)) continue;
      const key=alt.best.join(",");
      const av=values(alt.best);
      let dist=0; for(let i=0;i<5;i++){ const t=av[i]-ref[i]; dist+=t*t; }
      const prev=found.get(key);
      if(!prev||alt.n<prev.n) found.set(key,{setup:alt.best,round:ri,dim,rating:r,n:alt.n,dist});
    }
  }));
  return [...found.values()].sort((a,b)=>a.dist-b.dist||a.n-b.n).slice(0,ALT_MAX);
}
function repairRound(idx){
  const H=C().history, rec=H[idx];
  const cons=consOfRounds(H.filter((_,j)=>j!==idx));
  // 均勻抽樣而不是取前 N 個：前 N 個全集中在 Front Wing 低值端，會漏掉真正的修正
  const total=countOnly(cons), stride=Math.max(1,Math.ceil(total/REPAIR_CAP));
  const S=[]; let si=0;
  forEachCandidate(cons,(a,b,c,d,e,v)=>{ if(si++%stride===0) S.push(v.slice()); });
  if(!S.length) return [];
  const fitsWith=(setup,ratings)=>{
    const sv=values(setup);
    for(let j=0;j<S.length;j++){
      const c=S[j]; let ok=true;
      for(let k=0;k<5;k++){
        const r=ratings[k]; if(r===null) continue;
        const d=Math.abs(sv[k]-c[k]);
        if(d<RATINGS[r].lo-EPS||d>RATINGS[r].hi+EPS){ ok=false; break; }
      }
      if(ok) return true;
    }
    return false;
  };
  const out=[], seen=new Set();
  // (1) 輸入車手回報時點錯一格
  for(let i=0;i<5;i++){
    const cur=rec.ratings[i]; if(cur===null) continue;
    for(const nr of [cur-1,cur+1,cur-2,cur+2]){
      if(nr<0||nr>3) continue;
      const key="r"+i+":"+nr; if(seen.has(key)) continue; seen.add(key);
      const rr=rec.ratings.slice(); rr[i]=nr;
      if(fitsWith(rec.setup,rr))
        out.push({type:"rating",dim:i,from:cur,to:nr,cost:Math.abs(nr-cur)===1?1:3,
                  setup:rec.setup.slice(),ratings:rr});
    }
  }
  // (2) 遊戲裡調整的滑桿與建議不一致
  for(let p=0;p<5;p++) for(let x=0;x<=SLIDERS[p].max;x++){
    if(x===rec.setup[p]) continue;
    const key="s"+p+":"+x; if(seen.has(key)) continue; seen.add(key);
    const s=rec.setup.slice(); s[p]=x;
    if(fitsWith(s,rec.ratings))
      out.push({type:"slider",slider:p,from:rec.setup[p],to:x,cost:Math.abs(x-rec.setup[p]),
                setup:s,ratings:rec.ratings.slice()});
  }
  // (3) 單一修正都不行時，才試兩根滑桿
  if(!out.length){
    for(let p=0;p<5;p++) for(let q=p+1;q<5;q++)
      for(let x=0;x<=SLIDERS[p].max;x++) for(let y=0;y<=SLIDERS[q].max;y++){
        if(x===rec.setup[p]&&y===rec.setup[q]) continue;
        const s=rec.setup.slice(); s[p]=x; s[q]=y;
        const key=s.join(","); if(seen.has(key)) continue; seen.add(key);
        if(fitsWith(s,rec.ratings))
          out.push({type:"slider2",cost:10+Math.abs(x-rec.setup[p])+Math.abs(y-rec.setup[q]),
                    setup:s,ratings:rec.ratings.slice()});
      }
  }
  out.sort((a,b)=>a.cost-b.cost);
  return out.slice(0,6);
}
function rateOf(d){ for(let i=0;i<3;i++) if(d<=CUT[i]+EPS) return i; return 3; }
// Sprint：B–E 鎖死，只能動 A。挑「預期剩餘解最少」的那格，而不是最靠近先驗的那格
const SPRINT_CAP=30000;
function sprintOptions(cons,base,n){
  const stride=Math.max(1,Math.ceil(n/SPRINT_CAP));
  const cands=[]; let i=0;
  forEachCandidate(cons,(a,b,c,d,e,v)=>{ if(i++%stride===0) cands.push(v.slice()); });
  const M=cands.length; if(!M) return [];
  const opts=[];
  for(let A=0;A<=SLIDERS[0].max;A++){
    const tv=values([A,base[1],base[2],base[3],base[4]]);
    const map=new Map();
    for(let j=0;j<M;j++){
      const c=cands[j]; let sig=0;
      for(let k=0;k<5;k++) sig=sig*4+rateOf(Math.abs(tv[k]-c[k]));
      map.set(sig,(map.get(sig)||0)+1);
    }
    let ss=0; for(const m of map.values()) ss+=m*m;
    opts.push({a:A, exp:n*ss/(M*M), splits:map.size});
  }
  opts.sort((x,y)=>x.exp-y.exp || x.splits-y.splits);
  return opts;
}
function sameSetup(a,b){ return a.every((x,i)=>x===b[i]); }
function inPriors(key,s){ const t=byKey(key); return !!t&&t.setups.some(x=>sameSetup(x,s)); }
function pushLog(e){ log.push(e); if(log.length>LOG_MAX) log=log.slice(-LOG_MAX); save(); }
// 「有沒有存過」看的是這一場（sid＝某台車在某條賽道的一次找解）有沒有把結果寫進先驗，
// 而不是先驗裡有沒有一樣的設置 — 重複落點本身就是要記的樣本。
// 舊版履歷沒有 sid，沿用舊規則（先驗裡已有就不列）。
const sessKey=e=>e.sid ? "s:"+e.sid : "l:"+e.track+"|"+e.solved.join(",");
function sessEntries(e){ return log.filter(x=>x.solved && sessKey(x)===sessKey(e)); }
function sessSaved(e){            // 這一場已經存進先驗的解（若有）
  const x=sessEntries(e).find(x=>x.saved); return x?x.solved:null;
}
function markSess(e,flag,solved,val=true){
  sessEntries(e).forEach(x=>{ if(!solved||sameSetup(x.solved,solved)) x[flag]=val; });
}
// 每一場只看最新一次的收斂結果；已存或已忽略的不列
function unsavedSolved(){
  const seen=new Set(), out=[];
  for(let i=log.length-1;i>=0;i--){
    const e=log[i]; if(!e.solved) continue;
    const k=sessKey(e); if(seen.has(k)) continue; seen.add(k);
    if(e.saved||e.dismissed) continue;
    if(!e.sid && inPriors(e.track,e.solved)) continue;
    const prev=sessSaved(e);
    out.push({e, replaces: prev&&!sameSetup(prev,e.solved) ? prev : null});
  }
  return out;
}
// 把某一場的結果寫進先驗；若這一場先前存過另一組（之後被修正），先拿掉舊的那筆
function commitSolved(e,replace){
  const t=byKey(e.track); if(!t) return;
  if(replace){
    for(let i=t.setups.length-1;i>=0;i--) if(sameSetup(t.setups[i],replace)){ t.setups.splice(i,1); break; }
    markSess(e,"saved",replace,false); markSess(e,"dismissed",replace);
  }
  t.setups.push(e.solved.slice());
  markSess(e,"saved",e.solved);
  save();
}
// 目前這台車這一場：存過的解、以及對應目前結果的那筆收斂紀錄（沒有就補一筆，
// 例如結果是靠「改成這樣」修正出來、而不是記錄回饋時收斂的）
function sessSavedNow(){
  const x=log.find(e=>e.sid===C().sid && e.solved && e.saved); return x?x.solved:null;
}
function currentSolvedEntry(best){
  const sid=C().sid;
  for(let i=log.length-1;i>=0;i--){ const e=log[i]; if(e.sid===sid && e.solved && sameSetup(e.solved,best)) return e; }
  const e={t:Date.now(), sid, track:order[ri], car:active, setup:best.slice(),
           ratings:[null,null,null,null,null], n:1, solved:best.slice()};
  log.push(e); if(log.length>LOG_MAX) log=log.slice(-LOG_MAX);
  return e;
}

    ? `<div class="lsec">最近 ${recent.length} 筆回合（共 ${log.length}）</div>` + recent.map(e=>{

          ${e.sat!=null?`<span class="sat">${fmtH(e.sat)}%</span>`:""}
          <span class="nn">${e.solved?"已鎖定":"剩 "+e.n.toLocaleString("en-US")}</span>
        </div>`; }).join("")
    : `<p class="empty">還沒有任何回合。每按一次「記錄回饋」就會留下一筆，換賽道也不會清掉。</p>`;

function renderAlts(){

function renderDiag(){

function recompute(){

function attachSprint(){
  const car=C(), res=car.result;
  if(!res||res.n<1){ if(res) res.sprint=null; return; }
  // 這台車收斂到唯一解 = Sprint 中的資訊增益已完成，自動解除它自己的限制，
  // 給出五根滑桿的完整設置等 Q1 前套用；另一台車的開關不受影響
  if(car.sprint && res.n===1){
    car.sprint=false; car.sprintReleased=true;
    res.sprint=null;
    return;
  }
  if(!car.sprint){ res.sprint=null; return; }
  res.sprint=sprintOptions(constraintsOf(car),car.setup,res.n);
}

  const res=C().result;

  if(C().sprint&&res.sprint&&res.sprint.length){
    const s=C().setup.slice(); s[0]=res.sprint[0].a; return s;
  }
  return res.best.slice();
}

/* ---- 出場圈數試算 ---- */
function parseClock(s,bareIsMinutes){
  s=(s||"").trim(); if(!s) return NaN;
  const m=s.match(/^(\d+)\s*[:：]\s*([0-5]?\d(?:[.,]\d+)?)$/);
  if(m) return (+m[1])*60 + parseFloat(m[2].replace(",","."));
  const n=parseFloat(s.replace(",","."));
  if(!isFinite(n)) return NaN;
  return bareIsMinutes ? n*60 : n;
}
function clock(t){
  if(!isFinite(t)) return "—";
  const neg=t<0; t=Math.abs(t);
  const m=Math.floor(t/60), s=t-m*60;
  return (neg?"-":"")+m+":"+(s<10?"0":"")+s.toFixed(1);
}
function calcLaps(){
  const el=$("cOut");
  const T=parseClock($("cT").value,true), L=parseClock($("cL").value,false);
  const O=parseClock($("cO").value,false)||0;
  if(!isFinite(T)||!isFinite(L)||L<=0){
    el.innerHTML=`<div class="sub">時間格式看不懂。剩餘時間可寫 <b>28:30</b> 或 <b>28</b>（分鐘）；單圈可寫 <b>1:32.5</b> 或 <b>92.5</b>（秒）。</div>`;
    return;
  }
  const usable=T-O;
  if(usable<=0){ el.innerHTML=`<div class="big">0 <small>圈</small></div><div class="sub">扣掉額外時間後已經沒有可用時間了。</div>`; return; }
  const full=Math.floor(usable/L);
  const left=usable-full*L;
  const cross=left>1e-9?full+1:full;
  el.innerHTML=
    `<div class="big">${full} <small>圈（完整跑完）</small></div>`
    +`<div class="sub">`
    +`${full} 圈共 <b>${clock(full*L)}</b>，跑完還剩 <b>${clock(left)}</b>。`
    +(cross>full?`<br>時間歸零前還來得及出發最後一圈 → <span class="warn2">${cross} 圈</span>，會超出 <b>${clock(L-left)}</b>。`:``)
    +(O?`<br>已扣掉出場／進站的 <b>${clock(O)}</b>。`:``)
    +`</div>`;
}
["cT","cL","cO"].forEach(id=>$(id).addEventListener("input",calcLaps));

const atrPart=chipGroup("atrPart",null), atrType=chipGroup("atrType","Design");
function atrPeriods(Y,extra){
  const list=extra?Y.entries.concat([extra]):Y.entries;
  const out=[]; let cur=null;
  const fits=(c,w)=>(Y.pcfd===null||cur.c+c<=Y.pcfd+ATR_EPS)&&(Y.pwt===null||cur.w+w<=Y.pwt+ATR_EPS);
  for(const e of list){
    const empty=!cur||(cur.c<=ATR_EPS&&cur.w<=ATR_EPS);
    if(!cur || (!empty && (e.np || !fits(e.cfd,e.wt)))){ cur={n:out.length+1,c:0,w:0,entries:[]}; out.push(cur); }
    cur.entries.push(e); cur.c+=e.cfd; cur.w+=e.wt;
  }
  out.forEach(P=>P.over=(Y.pcfd!==null&&P.c>Y.pcfd+ATR_EPS)||(Y.pwt!==null&&P.w>Y.pwt+ATR_EPS));
  return out;
}
// 目前這一期還剩多少（最後一期已滿就是下一期的完整額度）
function atrOpen(Y){
  const P=atrPeriods(Y), last=P[P.length-1];
  const full=!last||((Y.pcfd===null||last.c>=Y.pcfd-ATR_EPS)&&(Y.pwt===null||last.w>=Y.pwt-ATR_EPS));
  if(full) return {n:(last?last.n:0)+1, c:Y.pcfd, w:Y.pwt};
  return {n:last.n, c:Y.pcfd===null?null:Y.pcfd-last.c, w:Y.pwt===null?null:Y.pwt-last.w};
}
function atrUsed(Y){
  const u={cfd:{Design:0,Research:0},wt:{Design:0,Research:0},parts:{}};
  ATR_PARTS.forEach(p=>u.parts[p]={cfd:{Design:0,Research:0},wt:{Design:0,Research:0}});
  Y.entries.forEach(e=>{ u.cfd[e.type]+=e.cfd; u.wt[e.type]+=e.wt; u.parts[e.part].cfd[e.type]+=e.cfd; u.parts[e.part].wt[e.type]+=e.wt; });
  return u;
}
function atrBlock(Y,res,label){
  const u=atrUsed(Y), q=Y[res==="cfd"?"pcfd":"pwt"], tot=q===null?null:q*ATR_N, used=u[res].Design+u[res].Research;
  const scale=Math.max(tot||0,used)||1;
  const w=x=>(x/scale*100).toFixed(2)+"%";
  const left = tot!==null ? `全年剩 <b>${fmtH(tot-used)}</b> / ${fmtH(tot)}` : `已用 <b>${fmtH(used)}</b>（未填單期額度）`;
  const pmax=Math.max(1e-9,...ATR_PARTS.map(p=>u.parts[p][res].Design+u.parts[p][res].Research));
  return `<div class="abl"><div class="t"><span>${label}</span><span>${left}</span></div>
    <div class="abar${tot!==null&&used>tot+ATR_EPS?" over":""}"><i class="d" style="width:${w(u[res].Design)}"></i><i class="r" style="width:${w(u[res].Research)}"></i></div>
    ${ATR_PARTS.map(p=>{ const d=u.parts[p][res].Design, r=u.parts[p][res].Research;
      return `<div class="arow"><span>${p}</span><div class="abar"><i class="d" style="width:${(d/pmax*100).toFixed(2)}%"></i><i class="r" style="width:${(r/pmax*100).toFixed(2)}%"></i></div><span class="v">${fmtH(d+r)}</span></div>`; }).join("")}
  </div>`;
}
// 六期的使用率小格
function atrPeriodStrip(Y){
  const P=atrPeriods(Y), n=Math.max(ATR_N,P.length);
  const cell=(i,res)=>{ const p=P[i], q=Y[res==="c"?"pcfd":"pwt"], v=p?p[res]:0;
    const pct=q?Math.min(100,v/q*100):0;
    return `<div class="pc${p&&p.over?" over":""}${i>=ATR_N?" extra":""}"><div class="pf" style="width:${pct.toFixed(1)}%"></div><span>${p?fmtH(v):"·"}</span></div>`; };
  return `<div class="pstrip" style="grid-template-columns:42px repeat(${n},1fr)">
    <span></span>${Array.from({length:n},(_,i)=>`<span class="ph${i>=ATR_N?" extra":""}">P${i+1}</span>`).join("")}
    <span class="pl">CFD</span>${Array.from({length:n},(_,i)=>cell(i,"c")).join("")}
    <span class="pl">風洞</span>${Array.from({length:n},(_,i)=>cell(i,"w")).join("")}
  </div>${P.length>ATR_N?`<p class="ferr" style="padding:0 14px 8px">紀錄排出了 ${P.length} 期，超過一年 6 期 — 檢查是否有一筆時數填錯，或某次換期被誤判。</p>`:""}`;
}
function atrEntries(Y,y,editable){
  if(!Y.entries.length) return `<p class="empty">${editable?"還沒有紀錄。":"沒有紀錄。"}</p>`;
  const P=atrPeriods(Y);
  return P.slice().reverse().map(p=>`<div class="phd${p.over?" over":""}">第 ${p.n} 期
      <span>CFD ${fmtH(p.c)}${Y.pcfd!==null?" / "+fmtH(Y.pcfd):""} · 風洞 ${fmtH(p.w)}${Y.pwt!==null?" / "+fmtH(Y.pwt):""}${p.over?" · 超出單期額度":""}</span></div>`
    + p.entries.slice().reverse().map((e,k,arr)=>{
      const first = p.n===1 && k===arr.length-1;            // 整年第一筆不能再「開新一期」
      const npBtn = !editable||first ? "" :
        (e.np ? `<button class="npb on" data-np="${e.id}" title="這筆是手動開的新一期；按下取消，改回自動判斷">取消新期</button>`
              : (k===arr.length-1 ? "" : `<button class="npb" data-np="${e.id}" title="上一期沒用滿就換期了：從這筆開始算新的一期">從這筆開新一期</button>`));
      return `<div class="erow2">
      <span class="p">${e.part}</span><span class="k ${e.type==="Design"?"d":"r"}">${e.type}</span>
      <span class="h">CFD ${fmtH(e.cfd)} · 風洞 ${fmtH(e.wt)}</span>
      ${editable?delBtn("x","atr:"+y+":"+e.id):"<span></span>"}
      ${npBtn||e.note?`<span class="nt">${npBtn}${e.note?esc(e.note):""}</span>`:""}
    </div>`; }).join("")).join("");
}
function atrPreview(){
  const Y=atrY(), c=num($("atrCfd").value), w=num($("atrWt").value), el=$("atrNext"), o=atrOpen(Y);
  if(c===null&&w===null){
    el.textContent = (Y.pcfd===null&&Y.pwt===null) ? "" :
      o.n>ATR_N ? `今年 ${ATR_N} 期額度已全部用完` :
      `目前第 ${o.n} 期，本期剩 CFD ${fmtH(o.c)} · 風洞 ${fmtH(o.w)}`;
    return;
  }
  const P=atrPeriods(Y,{cfd:c||0,wt:w||0}), last=P[P.length-1];
  el.innerHTML = `這筆會記在 <b>第 ${last.n} 期</b>`
    + (last.over?`<span style="color:var(--bad)">（超出單期額度）</span>`:"")
    + (last.n>ATR_N?`<span style="color:var(--bad)">（超過一年 ${ATR_N} 期）</span>`:"");
}
function renderAtr(){
  const Y=atrY();
  $("atrYear").textContent=season;
  if(document.activeElement!==$("atrCfdTot")) $("atrCfdTot").value=Y.pcfd??"";
  if(document.activeElement!==$("atrWtTot"))  $("atrWtTot").value=Y.pwt??"";
  $("atrQuota").textContent = (Y.pcfd!==null||Y.pwt!==null)
    ? `全年 ×6：CFD ${fmtH(Y.pcfd===null?null:Y.pcfd*ATR_N)} · 風洞 ${fmtH(Y.pwt===null?null:Y.pwt*ATR_N)}　半期：${fmtH(Y.pcfd/2)} · ${fmtH(Y.pwt/2)}`
    : "填入單期額度後，紀錄才會自動分期，下方快捷鍵也才會帶入數值";
  document.querySelectorAll("#atrSide .q").forEach(b=>b.disabled=(b.dataset.f==="atrCfd"?Y.pcfd:Y.pwt)===null);
  $("atrChart").innerHTML = atrPeriodStrip(Y) + atrBlock(Y,"cfd","CFD")+atrBlock(Y,"wt","風洞")
    + `<div class="alg"><span><i style="background:var(--band)"></i>Design</span><span><i style="background:var(--optimal)"></i>Research</span></div>`;
  $("atrList").innerHTML = atrEntries(Y,season,true);
  atrPreview();
  const has=y=>atr[y].entries.length||atr[y].pcfd!==null||atr[y].pwt!==null;
  const old=Object.keys(atr).map(Number).filter(y=>y!==season&&has(y)).sort((a,b)=>b-a);
  $("atrOldPanel").hidden=!old.length;
  $("atrOld").innerHTML = old.map(y=>{ const Y2=atr[y], u=atrUsed(Y2);
    return `<details class="yr"><summary>${y} · CFD ${fmtH(u.cfd.Design+u.cfd.Research)} · 風洞 ${fmtH(u.wt.Design+u.wt.Research)} · ${atrPeriods(Y2).length} 期 ${Y2.entries.length} 筆</summary>
      ${atrPeriodStrip(Y2)}${atrBlock(Y2,"cfd","CFD")}${atrBlock(Y2,"wt","風洞")}${atrEntries(Y2,y,false)}
      ${delBtn("ydel","atry:"+y,"刪除 "+y+" 整年的 ATR 紀錄")}</details>`; }).join("");
}
["atrCfdTot","atrWtTot"].forEach(id=>$(id).addEventListener("change",e=>{
  atrY()[id==="atrCfdTot"?"pcfd":"pwt"]=num(e.target.value); save(); renderAtr();
}));
["atrCfd","atrWt"].forEach(id=>$(id).addEventListener("input",atrPreview));
$("atrSide").addEventListener("click",e=>{
  const q=e.target.closest(".q");
  if(q){
    const Y=atrY(), cf=q.dataset.f==="atrCfd", per=Y[cf?"pcfd":"pwt"]; if(per===null) return;
    const v = q.dataset.d==="rem" ? atrOpen(Y)[cf?"c":"w"] : per/+q.dataset.d;
    $(q.dataset.f).value=String(Math.round(v*100)/100); atrPreview(); return;
  }
  const npb=e.target.closest(".npb");
  if(npb){ const en=atrY().entries.find(x=>x.id===npb.dataset.np); if(en){ en.np=!en.np; save(); renderAtr(); } return; }
  const x=e.target.closest("button[data-k]"); if(!x) return;
  const k=x.dataset.k;
  if(!armed(k,renderAtr)) return;
  const [kind,y,id]=k.split(":");
  if(kind==="atr"){ const Y=atr[y]; Y.entries=Y.entries.filter(en=>en.id!==id); }
  else if(kind==="atry"){ delete atr[y]; }
  save(); renderAtr();
});
$("atrAdd").addEventListener("click",()=>{
  const err=$("atrErr"), part=atrPart.get(), cfd=num($("atrCfd").value), wt=num($("atrWt").value);
  const msg = !part ? "先選部件。" : (cfd===null&&wt===null) ? "CFD 和風洞至少填一個。" : (cfd<0||wt<0) ? "時數不能是負的。" : "";
  err.hidden=!msg; err.textContent=msg; if(msg) return;
  atrY().entries.push({id:uid(), t:Date.now(), part, type:atrType.get()||"Design", cfd:cfd||0, wt:wt||0, note:$("atrNote").value.trim(), np:false});
  $("atrCfd").value=""; $("atrWt").value=""; $("atrNote").value="";
  save(); renderAtr();
});

/* ---- 輪胎 ---- */
// 天氣與賽道狀況（Grip、Rubber、積水）會在同一段 stint 裡變動，反而干擾判讀，所以不再記錄；
// 改成依「節次 × 車號」分開統計。雨天與雨胎變動太大，不提供輸入，也不列入統計。
const tySess=chipGroup("tySess",null,v=>{ if(v==="Q"&&!$("tyLaps").value) $("tyLaps").value="3"; tyLive(); });
const tyCar=chipGroup("tyCar",null), tyComp=chipGroup("tyComp",null,()=>tyLive()), tyMode=chipGroup("tyMode",null,()=>tyLive());
let tyPendingTags=[];
const perLap=r=>(r.end===null||!r.laps)?null:(r.start-r.end)/r.laps;
function tyLive(){
  const s=num($("tyStart").value)??100, l=num($("tyLaps").value), e=num($("tyEnd").value);
  $("tyLive").innerHTML = (l&&e!==null) ? `${fmtH(s)}% → ${fmtH(e)}%，${l} 圈 ＝ 每圈 <b>${(((s-e)/l)).toFixed(2)}%</b>` : "";
}
["tyStart","tyLaps","tyEnd"].forEach(id=>$(id).addEventListener("input",tyLive));
function renderTagInput(){
  $("tyTags").innerHTML=tyPendingTags.map((t,i)=>`<span class="tag user">${esc(t)}<button data-ti="${i}" aria-label="移除">×</button></span>`).join("");
  $("tyTagList").innerHTML=tyreTags.map(t=>`<option value="${esc(t)}">`).join("");
}
$("tyTagIn").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return; e.preventDefault();
  const v=e.target.value.trim(); if(!v) return;
  if(!tyPendingTags.includes(v)) tyPendingTags.push(v);
  if(!tyreTags.includes(v)){ tyreTags.push(v); save(); }
  e.target.value=""; renderTagInput();
});
$("tyTags").addEventListener("click",e=>{ const b=e.target.closest("button[data-ti]"); if(!b) return; tyPendingTags.splice(+b.dataset.ti,1); renderTagInput(); });
let tyTarget=30;
const carLabel=c=>c===0?"Car 1":c===1?"Car 2":"未分車";
function renderTyres(){
  const t=T(); if(!t) return;
  $("tyHead").textContent=t.code+" · "+season;
  const rows=tyres.filter(r=>r.track===t.key);
  // 統計：節次 → 胎種 × 模式 → 車號；跨所有賽季，以總消耗 ÷ 總圈數加權
  const S=new Map(); let nEx=0, nWet=0; const qRows=[];
  rows.forEach(r=>{
    const pl=perLap(r); if(pl===null) return;
    if(!DRY.includes(r.comp)){ nWet++; return; }
    if(r.session==="Q"){ qRows.push(r); return; }
    if(r.excl){ nEx++; return; }
    const sk=r.session?ZONE[r.session]:"—";
    if(!S.has(sk)) S.set(sk,{rows:new Map(), cars:new Set()});
    const sess=S.get(sk), rk=r.comp+"|"+(r.mode||"—"), ck=r.car===null?"x":r.car;
    sess.cars.add(ck);
    if(!sess.rows.has(rk)) sess.rows.set(rk,{comp:r.comp,mode:r.mode||"—",cells:{}});
    const c=sess.rows.get(rk).cells[ck]||(sess.rows.get(rk).cells[ck]={n:0,laps:0,wear:0});
    c.n++; c.laps+=r.laps; c.wear+=r.start-r.end;
  });
  const sessOrder=["FP","SR","—"].filter(k=>S.has(k));
  const cell=c=>{ if(!c) return `<td class="na">—</td>`; const a=c.wear/c.laps;
    return `<td><b>${a.toFixed(2)}%</b><small>${a>0?"≈"+Math.floor((100-tyTarget)/a)+" 圈 · ":""}${c.n} 筆</small></td>`; };
  qRows.sort((a,b)=>b.season-a.season||b.t-a.t);
  const qHtml = qRows.length ? `<div class="ssec">Q / SQ 紀錄（只記錄，不列入平均）</div>
      <table><tr><th>車</th><th>胎種 · 模式</th><th>耐久</th><th>這一次扣</th></tr>
      ${qRows.map(r=>`<tr><td>${carLabel(r.car)}</td><td class="cm">${r.comp} · ${r.mode||"—"}</td>
        <td>${fmtH(r.start)}→${fmtH(r.end)}% · ${r.laps} 圈</td><td><b>−${fmtH(r.start-r.end)}%</b><small>${r.season}</small></td></tr>`).join("")}</table>` : "";
  $("tyStats").innerHTML = sessOrder.length||qRows.length||nEx||nWet ? `<div class="tst">
      <div class="hd">${t.code} 歷年平均 · 用到剩 <input id="tyTarget" value="${tyTarget}" inputmode="decimal">% 約幾圈</div>
      ${sessOrder.map(sk=>{ const sess=S.get(sk);
        const cols=[0,1].concat(sess.cars.has("x")?["x"]:[]);
        const R=[...sess.rows.values()].sort((a,b)=>DRY.indexOf(a.comp)-DRY.indexOf(b.comp)||MODES.indexOf(a.mode)-MODES.indexOf(b.mode));
        return `<div class="ssec">${ZONE_LABEL[sk]}</div>
          <table><tr><th>胎種 · 模式</th>${cols.map(c=>`<th>${carLabel(c==="x"?null:c)}</th>`).join("")}</tr>
          ${R.map(g=>`<tr><td class="cm">${g.comp} · ${g.mode}</td>${cols.map(c=>cell(g.cells[c])).join("")}</tr>`).join("")}</table>`; }).join("")}
      ${qHtml}
      ${nEx?`<div class="ex">另有 ${nEx} 筆標記排除統計，未列入平均。</div>`:""}
      ${nWet?`<div class="ex">${nWet} 筆雨胎紀錄不列入統計。</div>`:""}</div>` : "";
  const sel=(r,f)=>{ const opts=f==="session"?SESSIONS.map(x=>[x,SESSION_LABEL[x]]):[[0,"Car 1"],[1,"Car 2"]];
    return `<select class="fixsel" data-id="${r.id}" data-f="${f}"><option value="">${f==="session"?"補節次":"補車號"}</option>${opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select>`; };
  $("tyList").innerHTML = rows.length ? rows.slice().sort((a,b)=>b.season-a.season||b.t-a.t).map(r=>{
      const pl=perLap(r), wet=!DRY.includes(r.comp);
      const env=[r.air!==null?"氣溫 "+fmtH(r.air)+"°":null, r.trk!==null?"賽道 "+fmtH(r.trk)+"°":null].filter(Boolean).join(" · ");
      return `<div class="trow${r.excl||wet?" ex":""}">
        <span class="a">${r.session?`<span class="sb">${SESSION_LABEL[r.session]}</span>`:sel(r,"session")}${r.car!==null?`<span class="sb">${carLabel(r.car)}</span>`:sel(r,"car")}
          <b>${r.comp}</b> ${r.mode||""} · ${fmtH(r.start)}→${r.end===null?"?":fmtH(r.end)}% / ${r.laps} 圈 · ${r.season}</span>
        <span class="r"><span class="pl">${pl===null?"—":pl.toFixed(2)+"%"}</span>${delBtn("x","ty:"+r.id)}</span>
        ${env||r.excl||wet?`<span class="c">${esc(env)}${r.excl?(env?" · ":"")+"排除統計":""}${wet?(env?" · ":"")+"雨胎，不列入統計":""}</span>`:""}
        ${r.tags.length?`<span class="tags">${r.tags.map(x=>`<span class="tag user">${esc(x)}</span>`).join("")}</span>`:""}
        ${r.note?`<span class="nt">${esc(r.note)}</span>`:""}
      </div>`; }).join("")
    : `<p class="empty">這條賽道還沒有輪胎紀錄。</p>`;
}
$("tyStats").addEventListener("change",e=>{ if(e.target.id!=="tyTarget") return; const v=num(e.target.value); if(v!==null&&v>=0&&v<100) tyTarget=v; renderTyres(); });
// 舊紀錄沒有節次 / 車號：清單上直接補
$("tyList").addEventListener("change",e=>{
  const sel=e.target.closest(".fixsel"); if(!sel||sel.value==="") return;
  const r=tyres.find(x=>x.id===sel.dataset.id); if(!r) return;
  r[sel.dataset.f] = sel.dataset.f==="car" ? +sel.value : sel.value;
  save(); renderTyres();
});
$("tyList").addEventListener("click",e=>{
  const x=e.target.closest("button[data-k]"); if(!x) return;
  if(!armed(x.dataset.k,renderTyres)) return;
  const id=x.dataset.k.split(":")[1]; tyres=tyres.filter(r=>r.id!==id); save(); renderTyres();
});
$("tyAdd").addEventListener("click",()=>{
  const err=$("tyErr"), carV=tyCar.get();
  const r={id:uid(), t:Date.now(), track:T().key, season,
    session:tySess.get(), car:carV===null?null:+carV,
    air:num($("tyAir").value), trk:num($("tyTrk").value), weather:null, water:null, grip:null, rubber:null,
    comp:tyComp.get(), mode:tyMode.get(),
    start:num($("tyStart").value)??100, laps:num($("tyLaps").value), end:num($("tyEnd").value),
    tags:tyPendingTags.slice(), excl:$("tyExcl").checked, note:$("tyNote").value.trim()};
  const msg = !r.session ? "先選節次（FP1–FP3、Q / SQ、Sprint、正賽）。"
    : r.car===null ? "先選 Car 1 或 Car 2。"
    : !r.comp ? "先選胎種。"
    : (!r.laps||r.laps<=0||!Number.isInteger(r.laps)) ? "圈數要填正整數。"
    : r.end===null ? "填剩餘耐久。"
    : (r.end<0||r.end>r.start) ? "剩餘耐久要介於 0 和起始耐久之間。"
    : (r.start<=0||r.start>100) ? "起始耐久要介於 0–100。" : "";
  err.hidden=!msg; err.textContent=msg; if(msg) return;
  tyres.push(r);
  // 節次、車號、胎種、模式、溫度保留給下一筆；這一段的數字和標籤清掉
  $("tyLaps").value = r.session==="Q" ? "3" : ""; $("tyEnd").value=""; $("tyStart").value="100"; $("tyNote").value=""; $("tyExcl").checked=false;
  tyPendingTags=[]; renderTagInput(); tyLive();
  save(); renderTyres();
});
function renderSides(){ $("season").value=season; renderAtr(); renderTyres(); renderTagInput(); }

/* ================= 啟動 ================= */
buildStatic();
try{ const saved=storage.read(); if(saved) applySnapshot(saved); }catch(e){}
renderSaveState();
renderSides();
renderCal();
seedFromPrior();
recompute();
</script>
